# Local assessment against the supplied Bronze rules, not an awarded Core tier.
# See docs/BRONZE_QUALITY_SCALE.md for evidence and upstream publication work.
rules:
  action-setup:
    status: exempt
    comment: The integration does not register any integration-specific actions.
  appropriate-polling:
    status: exempt
    comment: >-
      Calculations are driven by Home Assistant state events. No device or service
      is polled. The local minute timer handles tariff boundaries; optional demand
      estimation reads recorder statistics at their five-minute resolution.
  brands:
    status: todo
    comment: >-
      Local icon and logo assets are included. The required publication in
      home-assistant/brands has not been verified; see docs/upstream/.
  common-modules:
    status: done
    comment: >-
      The calculated runtime is in runtime.py. There is no DataUpdateCoordinator
      or cross-platform base entity to relocate; sensor.py is the only platform.
  config-flow:
    status: done
    comment: >-
      UI setup and options flows use selectors and describe every field. Meter
      references stay in data; editable settings are stored in options. Version
      1.3 retains source identity metadata and migrates existing contracts while
      preserving effective settings and existing sensor and ledger keys.
  config-flow-test-coverage:
    status: done
    comment: >-
      User and options flows have measured 100% statement and branch coverage,
      recovery tests for every form error, and created-entry unique-ID assertions.
      CI requires full coverage on each run.
  dependency-transparency:
    status: exempt
    comment: No external Python requirements are declared in manifest.json.
  docs-actions:
    status: exempt
    comment: The integration does not provide integration-specific actions.
  docs-conditions:
    status: exempt
    comment: The integration does not provide integration-specific conditions.
  docs-high-level-description:
    status: exempt
    comment: >-
      This is a calculated helper with no external device or service. The README
      still explains its purpose, supported tariff features and local data sources.
  docs-installation-instructions:
    status: todo
    comment: >-
      The README documents custom-integration installation and prerequisites.
      Publication of the prepared documentation on home-assistant.io remains
      outstanding; the strict Bronze rule requires that upstream documentation.
  docs-removal-instructions:
    status: todo
    comment: >-
      The README documents entry removal, stored-data deletion and file cleanup.
      Publication of the prepared documentation on home-assistant.io remains
      outstanding; the strict Bronze rule requires that upstream documentation.
  docs-triggers:
    status: exempt
    comment: The integration does not provide integration-specific triggers.
  entity-event-setup:
    status: done
    comment: >-
      Sensors subscribe to dispatcher updates in async_added_to_hass and register
      the unsubscribe callback with async_on_remove.
  entity-unique-id:
    status: done
    comment: >-
      Every sensor receives an entry-scoped unique ID. Tracked source registry
      identities retain their original sensor and ledger keys across source
      renames. Different meters reusing an entity ID receive distinct keys.
  has-entity-name:
    status: done
    comment: >-
      TariffSensor sets has_entity_name to true. Sensor names describe values
      within the contract device rather than repeating the contract name.
  runtime-data:
    status: done
    comment: >-
      TariffConfigEntry is typed as ConfigEntry[TariffRuntime]; setup assigns
      entry.runtime_data and platforms and diagnostics read it there.
  test-before-configure:
    status: exempt
    comment: >-
      This calculated helper has no device or service connection to test. The
      config flow still validates selected cumulative energy meters and tariffs.
  test-before-setup:
    status: done
    comment: >-
      Setup validates tariff construction and starts the recorder/storage runtime.
      Invalid configuration raises ConfigEntryError; temporary recorder or storage
      failures raise ConfigEntryNotReady and clean up subscriptions.
  unique-config-entry:
    status: done
    comment: >-
      The config flow compares persistent import/export registry identities and
      aborts when that meter pair is already configured, including after renames.
      Existing contract unique IDs are preserved; unregistered meters use their
      configured entity references until a registry identity becomes available.
