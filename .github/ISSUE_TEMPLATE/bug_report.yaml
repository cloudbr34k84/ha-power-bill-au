# Generated by aurora@aurora-smart-home (ha-integration-dev skill)
# https://github.com/tonylofgren/aurora-smart-home

name: Bug report
description: Report a problem with HA Power Bill AU.
title: "[Bug]: "
body:
  - type: input
    id: integration_version
    attributes:
      label: HA Power Bill AU version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant Core version
      placeholder: "2026.11.0"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include relevant tariff settings and meter sensor units or state classes. Use made-up values when possible.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only relevant log lines. Remove credentials, account or meter identifiers, addresses and other personal information. Do not attach raw bills.
      render: text
