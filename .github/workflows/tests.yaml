# Generated by aurora@aurora-smart-home (ha-integration-dev skill)
# https://github.com/tonylofgren/aurora-smart-home

name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Home Assistant 2026.11.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            requirements_dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements_dev.txt

      - name: Check Python code
        run: python -m ruff check custom_components tests tools

      - name: Check Python formatting
        run: python -m ruff format --check custom_components tests tools

      - name: Run tests
        run: >-
          python -m coverage run --branch
          --source=custom_components.power_bill.config_flow
          -m pytest --junitxml=test-results/pytest.xml

      - name: Require full config flow coverage
        run: python -m coverage report --show-missing --fail-under=100

      - name: Export coverage report
        if: ${{ !cancelled() }}
        run: python -m coverage xml -o test-results/coverage.xml

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: test-results/*.xml
          if-no-files-found: ignore
          retention-days: 14
